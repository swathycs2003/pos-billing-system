<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gate Login</title>
    <!-- Official Tailwind CSS CDN Core Engine Play Distribution Script -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-slate-100 to-indigo-100 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-xl border border-slate-200 w-full max-w-md space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-block bg-indigo-50 border border-indigo-100 text-3xl p-3 rounded-xl shadow-sm">🔐</div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">System Identity Validation</h2>
            <p class="text-sm font-semibold text-slate-400">Please authenticate your credential parameters to proceed.</p>
        </div>

        <!-- Automated Core Django CSRF Security and Input Processing Form -->
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="p-3 bg-red-50 text-red-600 rounded-xl text-xs font-bold border border-red-200 text-center shadow-sm">
                Invalid identifier profile parameters or signature password.
            </div>
            {% endif %}

            <div>
                <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1">Username Reference</label>
                <input type="text" name="username" required autofocus 
                       class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-150 bg-slate-50 text-slate-800 font-medium">
            </div>

            <div>
                <label class="block text-xs font-black uppercase tracking-wider text-slate-500 mb-1">Secret Password</label>
                <input type="password" name="password" required 
                       class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-150 bg-slate-50 text-slate-800 font-medium">
            </div>

            <!-- Hidden field that passes our secure router link to Django's Login Engine -->
            <input type="hidden" name="next" value="/portal-router/" />

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-xl transition duration-200 shadow-md hover:shadow-indigo-200 tracking-wide cursor-pointer">
                Authorize Session Access
            </button>
        </form>

        <div class="text-center border-t border-slate-100 pt-4">
            <a href="/" class="text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-indigo-600 transition duration-150">
                &larr; Return to Public Main Page
            </a>
        </div>
    </div>

</body>
</html>
