<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gate Login</title>
    <style>
        /* 100% Offline Stylesheet - Bypasses all CDN Blocks and Network Lags */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #e2e8f0;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge-icon {
            background-color: #f5f3ff;
            border: 1px solid #ddd6fe;
            font-size: 32px;
            padding: 12px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 14px;
            line-height: 1;
        }

        h2 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #475569;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            color: #0f172a;
            font-weight: 500;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .error-box {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fee2e2;
            padding: 14px;
            text-align: center;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-submit {
            width: 100%;
            background-color: #4f46e5;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.15s ease;
            margin-top: 8px;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .footer-link {
            text-align: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            margin-top: 28px;
        }

        .footer-link a {
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.15s ease;
        }

        .footer-link a:hover {
            color: #4f46e5;
        }
    </style>
</head>
<body>

    <!-- Self-Contained Card Container Element -->
    <div class="login-card">
        
        <!-- Header Section -->
        <div class="header">
            <div class="badge-icon">🔐</div>
            <h2>System Identity Validation</h2>
            <p class="subtitle">Please authenticate your parameters to proceed.</p>
        </div>

        
        <form method="POST" action="{% url 'custom_login' %}">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="error-box">
                Invalid identifier profile parameters or signature password.
            </div>
            {% endif %}

            <!-- Username Group -->
            <div class="form-group">
                <label>Username Reference</label>
                <input type="text" name="username" required autofocus placeholder="Enter your username...">
            </div>

            <!-- Secret Password Group -->
            <div class="form-group">
                <label>Secret Password</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>

            <!-- Routing Path Redirection Identifier -->
            <input type="hidden" name="next" value="/portal-router/" />

            <!-- Action Authenticate Button -->
            <button type="submit" class="btn-submit">
                Authorize Session Access
            </button>
        </form>

        <!-- Main Workspace Return Link -->
        <div class="footer-link">
            <a href="/">&larr; Return to Public Main Page</a>
        </div>
    </div>

</body>
</html>
